<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DayLong" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DayLong</title>
    <link rel="apple-touch-icon" href="images.png?v=1" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="dateLabel">오늘</p>
          <h1>DayLong</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="테마 변경">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <section class="status-panel" aria-label="오늘 진행 상황">
        <div class="now-row">
          <span class="status-label">현재 일정</span>
          <div class="now-copy">
            <strong id="nowTask">확인 중</strong>
            <span id="timeLeft">남은 시간 확인 중</span>
            <span id="nextTask">다음 일정 확인 중</span>
          </div>
        </div>
        <div>
          <span class="status-label">오늘 완료</span>
          <strong id="doneCount">0/0</strong>
        </div>
        <div class="notify-row">
          <span class="status-label">일정 알림</span>
          <button class="text-button notify-button" id="notifyToggle" type="button">알림 켜기</button>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progressFill"></span>
        </div>
      </section>

      <nav class="tabs" aria-label="보기 전환">
        <button class="tab is-active" type="button" data-view="today">오늘</button>
        <button class="tab" type="button" data-view="week">1주일</button>
        <button class="tab" type="button" data-view="routine">오늘 루틴</button>
      </nav>

      <section class="view is-active" id="todayView" aria-label="오늘 타임라인">
        <div class="section-title">
          <h2 id="todayTitle">오늘 타임라인</h2>
          <button class="text-button" id="resetToday" type="button">오늘 초기화</button>
        </div>
        <ol class="timeline" id="todayTimeline"></ol>

        <section class="routine-panel" id="routinePanel" aria-label="오늘 루틴">
          <div class="section-title">
            <h2>오늘 루틴</h2>
            <span class="routine-count" id="routineCount">0/5</span>
          </div>
          <label class="routine-reminder">
            <span>루틴 알림</span>
            <input id="routineReminderTime" type="time" value="20:00" />
          </label>
          <div class="routine-list" id="routineList"></div>
        </section>

        <section class="settings-panel" aria-label="설정">
          <div class="color-row" aria-label="현재 일정 강조색">
            <span class="status-label">강조색</span>
            <div class="color-swatches">
              <button class="swatch is-active" type="button" data-current-color="blue" aria-label="파란색"></button>
              <button class="swatch" type="button" data-current-color="mint" aria-label="민트색"></button>
              <button class="swatch" type="button" data-current-color="rose" aria-label="로즈색"></button>
              <button class="swatch" type="button" data-current-color="slate" aria-label="슬레이트색"></button>
            </div>
          </div>
        </section>
      </section>

      <section class="view" id="weekView" aria-label="주간 일정">
        <div class="week-strip" id="weekStrip"></div>
        <div class="week-list" id="weekList"></div>
      </section>

      <button class="scroll-top" id="scrollTop" type="button" aria-label="맨 위로 이동">↑</button>
    </main>

  </body>
</html>
