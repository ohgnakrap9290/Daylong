name: DayLong Push Cron

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daylong-cron.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Trigger DayLong push cron
        run: |
          for i in {1..100}; do
            echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] push check $i/100"
            curl --fail --silent --show-error https://daylong77.vercel.app/api/cron
            echo
            if [ "$i" -lt 100 ]; then
              sleep 120
            fi
          done
